<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book High School | Gallery</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div id="site-header"></div>
    <script>
      (async function(){ const p=document.getElementById('site-header'); if(!p) return; try{ const r=await fetch('header.html',{cache:'no-store'}); if(r.ok) p.innerHTML=await r.text(); }catch(e){} })();
    </script>

    <header class="hero gallery-hero" role="banner" aria-label="Gallery hero">
        <div class="hero-content">
            <p class="eyebrow">School life in motion</p>
            <h1>Gallery</h1>
            <p>Moments from our classrooms, fields, clubs, and community life.</p>
        </div>
    </header>

    <main class="container gallery-main">
        <div class="gallery-toolbar" aria-label="Gallery categories">
            <span class="pill active">All</span>
            <span class="pill">Academics</span>
            <span class="pill">Sports</span>
            <span class="pill">Culture</span>
            <span class="pill">Campus</span>
        </div>

        <div class="gallery-grid" aria-label="School photo gallery">
            <figure class="gallery-item tall">
                <img src="https://images.unsplash.com/photo-1503676260728-1c00da094a0b?auto=format&fit=crop&w=900&q=80" alt="Students learning in a classroom">
                <figcaption>
                    <span>Academics</span>
                    <strong>Focused Learning</strong>
                </figcaption>
            </figure>
